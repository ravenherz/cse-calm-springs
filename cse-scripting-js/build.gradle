plugins {
    id 'java-library'
}

apply from: rootProject.file('gradle/cse-db.gradle')

description = 'JavaScript script documents and run records. No Mongo driver and no HTTP.'

dependencies {
    api project(':cse-dal-core')
    api project(':cse-core')
    implementation 'org.springframework.data:spring-data-mongodb'
    implementation 'org.graalvm.polyglot:polyglot:24.1.2'
    implementation 'org.graalvm.polyglot:js-community:24.1.2'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
