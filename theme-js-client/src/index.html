<!DOCTYPE html>
<html class="theme-js theme-modern" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${htmlTitle}">Calm Springs</title>
  <script id="script-cse-dist-jquery" type="text/javascript"
          th:src="@{/content-public/themes/__${stylesShell}__/js/jquery.min.js}"
          src="js/jquery.min.js"></script>
  <meta name="cse-context" th:content="${cseContextPath}">
  <meta name="csrf-token" th:if="${_csrf != null}" th:content="${_csrf.token}">
  <script id="script-cse-csrf" type="text/javascript"
          th:src="@{/content-public/themes/__${stylesShell}__/js/cse-csrf.js(v=7)}"
          src="js/cse-csrf.js?v=7"></script>
  <script id="script-cse-dist-bootstrap" type="text/javascript"
          th:src="@{/content-public/themes/__${stylesShell}__/js/bootstrap.min.js}"
          src="js/bootstrap.min.js"></script>
  <link rel="stylesheet" type="text/css"
        th:href="@{/content-public/themes/__${stylesShell}__/css/bootstrap.min.css}"
        href="css/bootstrap.min.css">
  <link id="styles-fonts" rel="stylesheet" type="text/css"
        th:href="@{/content-public/themes/__${stylesShell}__/css/fonts.css}"
        href="css/fonts.css">
  <link rel="stylesheet" href="content-public/cse-core/css/system.css"
        th:href="@{/content-public/cse-core/css/system.css}">
  <link rel="stylesheet"
        th:href="@{/content-public/themes/__${stylesTheme}__/css/styles.css}"
        href="css/styles.css">
  <link id="styles-schema" rel="stylesheet"
        th:href="@{/content-public/themes/__${stylesTheme}__/css/color-schemas/__${stylesSchema}__.css}"
        href="css/color-schemas/linen.css">
  <link rel="stylesheet"
        th:href="@{/content-public/themes/__${stylesTheme}__/css/cse-player.css}"
        href="css/cse-player.css">
  <link rel="icon" href="content-public/cse-core/images/favicon.ico"
        th:href="@{/content-public/cse-core/images/favicon.ico}"
        type="image/x-icon">
  <script id="script-cse-waveform" type="text/javascript"
          th:src="@{/content-public/themes/__${stylesShell}__/js/cse-waveform.js}"
          src="js/cse-waveform.js"></script>
  <script id="script-cse-player" type="text/javascript"
          th:src="@{/content-public/themes/__${stylesShell}__/js/cse-player.js}"
          src="js/cse-player.js"></script>
  <script th:src="@{/content-public/themes/__${stylesShell}__/js/theme.js}"
          src="js/theme.js" defer></script>
</head>
<body id="page-body" class="theme-js theme-modern">
<div class="cse-player">
  <div class="player-row">
    <span class="title"></span>
    <span class="artist"></span>
  </div>
  <div class="player-row controls">
    <div class="control-btns">
      <button class="replay-btn" title="Repeat">↺</button>
      <button class="play-btn" title="Play">▶</button>
      <button class="queue-btn" title="Queue">☰<span class="queue-badge"></span></button>
    </div>
    <div class="progress-bar">
      <div class="progress"></div>
    </div>
    <span class="time-current">0:00</span>
  </div>
</div>
<div class="cse-queue">
  <div class="queue-header">
    <h3>Queue</h3>
    <button class="clear-queue-btn">Clear & Close</button>
  </div>
  <ul class="cse-queue-list">
    <li class="cse-queue-empty">Queue is empty</li>
  </ul>
</div>

<header class="site-top">
  <a class="brand" id="site-brand" href="./">Calm Springs</a>
  <nav class="site-nav" id="site-nav"></nav>
  <div class="account-slot" id="account-slot" hidden>
    <a class="account-link" id="account-link" href="./apps/login/">Sign in</a>
  </div>
</header>

<main class="site-main" id="site-main">
  <p class="kicker">Loading</p>
</main>

<footer id="footer" class="site-foot">
  <div class="foot-up">
    <div class="foot-org" id="foot-org"
         th:utext="${TagCompanyName}+${TagCompanyPhysicalAddress}+${TagCompanyPhone}+${TagCompanyEmailAddress}+${TagCompanySocialLinks}"></div>
  </div>
  <div class="foot-divider"></div>
  <div class="foot-down">
    <div class="foot-copy" id="foot-copy"
         th:utext="${TagCopyrightHolder}+${TagCopyrightComment}"></div>
    <div class="foot-studio" id="foot-studio"
         th:utext="${TagBuilderLink}+${TagSoftVersion}"></div>
  </div>
</footer>

</body>
</html>
