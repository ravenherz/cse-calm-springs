plugins {
    id 'java-library'
}

apply from: rootProject.file('gradle/cse-db.gradle')

description = 'Markdown, page embeds, and article assembly. Theme body tags stay in the WAR.'

dependencies {
    api project(':cse-dal-core')
    api project(':cse-core')
    api project(':cse-security')
    api project(':cse-media')
    api 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.slf4j:slf4j-api'
    implementation 'org.springframework:spring-context'
    implementation 'org.commonmark:commonmark:0.22.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
