import org.gradle.api.tasks.compile.JavaCompile

apply from: 'gradle/theme-shared.gradle'

allprojects {

    group = 'com.ravenherz'

    ["prepareKotlinBuildScriptModel"].forEach {
        project.gradle.startParameter.excludedTaskNames.add(it)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }
}

tasks.register('packFrontend') {
    group = 'distribution'
    description = 'Pack every app-* (.cseapp) and theme-thymeleaf-* / theme-js-* (.csetheme) module'
    dependsOn ':cse:packFrontend'
}

subprojects {

}



