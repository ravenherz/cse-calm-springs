plugins {
    id 'java-library'
}

apply from: rootProject.file('gradle/cse-db.gradle')

description = 'CSE persistence ports and CMS entities'

dependencies {
    // Temporary: entities still use @Document / ObjectId. Strip after EntityId.
    api 'org.springframework.boot:spring-boot-starter-data-mongodb'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
