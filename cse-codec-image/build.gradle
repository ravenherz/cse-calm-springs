plugins {
    id 'java-library'
}

apply from: rootProject.file('gradle/cse-db.gradle')

description = 'JPEG, HEIC, image metadata, and PDF resource thumbnails. Article PDF stays in cse-codec-pdf.'

repositories {
    maven { url 'https://jitpack.io' }
}

dependencies {
    api project(':cse-dal-core')
    implementation 'org.slf4j:slf4j-api'
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'
    implementation 'com.drewnoakes:metadata-extractor:2.21.0'
    implementation 'com.github.openize-com:openize-heic-java:v26.5.1'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
