<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shared :: shared-head}"></head>
<body>
  <div class="editor-layout">
    <aside class="editor-sidebar" th:replace="~{fragments/shared :: shared-editor-sidebar}"></aside>
    <main class="editor-main resource-page">
      <div th:if="${error}" class="error-message" th:text="${error}">
        Error message
      </div>
      <div class="resource-browser">
        <th:block th:replace="~{fragments/shared :: shared-editor-tree}"></th:block>
        <section class="resource-pane">
          <div class="resource-pane-header">
            <div class="resource-pane-title">
              <h2>New category</h2>
            </div>
            <th:block th:replace="~{fragments/shared :: editor-inline-back}"></th:block>
          </div>

          <form th:action="@{/editor/category/create}" method="post" class="form-panel">
            <th:block th:replace="~{fragments/csrf :: field}"></th:block>
            <div class="form-group">
              <label for="itemName">Category Name (ID)</label>
              <input type="text" id="itemName" name="itemName" placeholder="my-category" required/>
            </div>
            <div class="form-group">
              <label for="navigationTitle">Navigation Title</label>
              <input type="text" id="navigationTitle" name="navigationTitle"/>
            </div>
            <div class="form-group">
              <label for="navigationDescription">Navigation Description</label>
              <input type="text" id="navigationDescription" name="navigationDescription"/>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="displayCount">Display count</label>
                <input type="number" id="displayCount" name="displayCount" min="0" step="1" value="0"/>
                <p class="field-hint">Items on the main page. 0 means all. Extra items get a Display more card.</p>
              </div>
              <div class="form-group">
                <label for="displayPriority">Display priority</label>
                <input type="number" id="displayPriority" name="displayPriority" step="1" value="0"/>
                <p class="field-hint">Higher number appears first on the main page and in navigation. Hidden categories stay hidden.</p>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group checkbox-group">
                <label>
                  <input type="checkbox" name="isVisible" id="isVisible"/>
                  Visible in navigation
                </label>
              </div>
              <div class="form-group checkbox-group">
                <label>
                  <input type="checkbox" name="isActive" id="isActive"/>
                  Active
                </label>
              </div>
            </div>
            <th:block th:replace="~{fragments/access :: panel(read=${accessRead}, edit=${accessEdit}, delete=${accessDelete}, canEdit=${accessCanEdit})}"></th:block>
            <div class="editor-actions">
              <button type="submit" class="btn btn-primary">Create category</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
