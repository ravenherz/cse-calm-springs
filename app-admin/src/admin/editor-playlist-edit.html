<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shared :: shared-head}"></head>
<body>
  <div class="editor-layout">
    <aside class="editor-sidebar" th:replace="~{fragments/shared :: shared-editor-sidebar}"></aside>
    <main class="editor-main resource-page">
      <div th:if="${error}" class="error-message" th:text="${error}">Error</div>
      <div class="resource-browser">
        <th:block th:replace="~{fragments/shared :: shared-editor-tree}"></th:block>
        <section class="resource-pane">
          <div class="resource-pane-header">
            <div class="resource-pane-title">
              <h2 th:text="${playlist.playlistData?.title} ?: 'Edit playlist'">Edit playlist</h2>
            </div>
            <th:block th:replace="~{fragments/shared :: editor-inline-back}"></th:block>
          </div>

          <form th:action="@{/editor/playlist/save}" method="post" class="form-panel" id="playlist-form">
            <th:block th:replace="~{fragments/csrf :: field}"></th:block>
            <input type="hidden" name="id" th:value="${playlist.id}"/>
            <th:block th:replace="~{fragments/playlist-form :: fields}"></th:block>
            <div class="form-group" th:if="${playlist.playlistId}">
              <label>Embed tag</label>
              <p class="field-hint">Paste this into any page’s Markdown/HTML:</p>
              <code class="embed-hint" th:text="'&lt;cse-playlist id=&quot;' + ${playlist.playlistId} + '&quot;&gt;&lt;/cse-playlist&gt;'">tag</code>
              <p class="field-hint">Add <code>withImage="true"</code> to show the playlist cover.</p>
            </div>
            <th:block th:replace="~{fragments/access :: panel(read=${accessRead}, edit=${accessEdit}, delete=${accessDelete}, canEdit=${accessCanEdit})}"></th:block>
            <div class="editor-actions">
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <th:block th:replace="~{fragments/playlist-form :: scripts}"></th:block>
</body>
</html>
