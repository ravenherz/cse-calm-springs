<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shared :: shared-head}"></head>
<body>
<div class="editor-layout">
  <aside class="editor-sidebar" th:replace="~{fragments/shared :: shared-editor-sidebar}"></aside>
  <main class="editor-main resource-page">
    <div th:if="${error}" class="error-message" th:text="${error}">
      Error message
    </div>

    <div class="resource-browser">
      <th:block th:replace="~{fragments/shared :: shared-editor-tree}"></th:block>
      <section class="resource-pane" th:if="${selectedGroup != null}"
               th:attr="data-video-progress-url=@{/editor/video/progress}">
        <div class="resource-pane-header">
          <th:block th:replace="~{fragments/shared :: folder-access-lock(group=${selectedGroup})}"></th:block>
          <div class="resource-pane-title">
            <h2 th:text="${selectedGroup.pathLabel}">Unsorted</h2>
            <span class="group-summary" th:unless="${selectedGroup.virtual or selectedGroup.categoryNode}">
              <span th:text="${selectedGroup.descendantFileCount}">0</span> files,
              <span th:text="${selectedGroup.descendantTotalSizeLabel}">0 bytes</span>
            </span>
          </div>
          <div class="resource-pane-tools">
            <button type="button" class="btn btn-secondary" id="resourceMultiSelect"
                    aria-pressed="false">Multi-select</button>
          </div>
          <form th:if="${selectedGroup.canEditAccess() and accessRoles != null}"
                th:action="@{/editor/resources/group/access}" method="post" class="access-form">
            <th:block th:replace="~{fragments/csrf :: field}"></th:block>
            <input type="hidden" name="groupId" th:value="${selectedGroup.id}"/>
            <input type="hidden" name="returnGroup" th:value="${selectedGroup.id}"/>
            <th:block th:replace="~{fragments/access :: panel(read=${selectedGroup.securityData.read}, edit=${selectedGroup.securityData.edit}, delete=${selectedGroup.securityData.delete}, canEdit=${selectedGroup.accessCanEdit})}"></th:block>
            <button type="submit" class="btn btn-primary" th:disabled="${selectedGroup.accessCanEdit == false}">Save access</button>
          </form>
        </div>

        <div th:if="${paneApps != null}" class="tile-grid-wrap">
          <ul class="item-list tile-grid">
            <li class="resource-plus-tile">
              <form th:action="@{/editor/apps/upload}" method="post" enctype="multipart/form-data"
                    class="resource-plus-form" id="packUploadForm">
                <th:block th:replace="~{fragments/csrf :: field}"></th:block>
                <input type="hidden" name="returnGroup" th:value="${selectedGroup.id}"/>
                <input type="hidden" name="slug" id="packSlug"/>
                <div class="resource-plus-drop" id="packDropZone">
                  <span class="group-toggle resource-plus-mark" aria-hidden="true"></span>
                  <span class="visually-hidden">Upload app</span>
                  <input type="file" id="packFile" name="file" accept=".cseapp" required/>
                </div>
              </form>
            </li>
            <th:block th:each="app : ${paneApps}">
              <li th:replace="~{fragments/shared :: app-row(app=${app}, returnGroup=${selectedGroup.id})}"></li>
            </th:block>
          </ul>
        </div>

        <div th:if="${paneThemes != null}" class="tile-grid-wrap">
          <form id="reorderForm" th:action="@{/editor/themes/reorder}" method="post" hidden>
            <th:block th:replace="~{fragments/csrf :: field}"></th:block>
            <input type="hidden" name="returnGroup" th:value="${selectedGroup.id}"/>
          </form>
          <ul class="item-list tile-grid" id="themeGrid">
            <li class="resource-plus-tile">
              <form th:action="@{/editor/themes/upload}" method="post" enctype="multipart/form-data"
                    class="resource-plus-form" id="packUploadForm">
                <th:block th:replace="~{fragments/csrf :: field}"></th:block>
                <input type="hidden" name="returnGroup" th:value="${selectedGroup.id}"/>
                <div class="resource-plus-drop" id="packDropZone">
                  <span class="group-toggle resource-plus-mark" aria-hidden="true"></span>
                  <span class="visually-hidden">Upload theme</span>
                  <input type="file" id="packFile" name="file" accept=".csetheme" required/>
                </div>
              </form>
            </li>
            <th:block th:each="theme : ${paneThemes}">
              <li th:replace="~{fragments/shared :: theme-row(theme=${theme}, returnGroup=${selectedGroup.id})}"></li>
            </th:block>
          </ul>
        </div>

        <div th:if="${panePlaylists != null}" class="tile-grid-wrap">
          <ul class="item-list tile-grid">
            <li class="resource-plus-tile">
              <a class="resource-plus-form" th:href="@{/editor/playlist/create}">
                <span class="resource-plus-drop">
                  <span class="group-toggle resource-plus-mark" aria-hidden="true"></span>
                  <span class="visually-hidden">New playlist</span>
                </span>
              </a>
            </li>
            <th:block th:each="playlist : ${panePlaylists}">
              <li th:replace="~{fragments/shared :: playlist-row(playlist=${playlist}, returnGroup=${selectedGroup.id})}"></li>
            </th:block>
          </ul>
        </div>

        <div th:if="${paneUrlTemplates != null}" class="tile-grid-wrap">
          <ul class="item-list tile-grid">
            <li class="resource-plus-tile">
              <a class="resource-plus-form" th:href="@{/editor/url-template/create}">
                <span class="resource-plus-drop">
                  <span class="group-toggle resource-plus-mark" aria-hidden="true"></span>
                  <span class="visually-hidden">New URL template</span>
                </span>
              </a>
            </li>
            <th:block th:each="template : ${paneUrlTemplates}">
              <li th:replace="~{fragments/shared :: url-template-row(template=${template}, returnGroup=${selectedGroup.id})}"></li>
            </th:block>
          </ul>
        </div>

        <div th:if="${paneCategories != null}" class="tile-grid-wrap">
          <ul class="item-list tile-grid">
            <li class="resource-plus-tile">
              <a class="resource-plus-form" th:href="@{/editor/category/create}">
                <span class="resource-plus-drop">
                  <span class="group-toggle resource-plus-mark" aria-hidden="true"></span>
                  <span class="visually-hidden">New category</span>
                </span>
              </a>
            </li>
            <th:block th:each="cat : ${paneCategories}">
              <li th:replace="~{fragments/shared :: category-row(cat=${cat}, returnGroup='content-categories')}"></li>
            </th:block>
          </ul>
        </div>

        <div th:if="${panePages != null}" class="tile-grid-wrap">
          <ul class="item-list tile-grid">
            <li class="resource-plus-tile">
              <a class="resource-plus-form"
                 th:href="@{/editor/create(categoryId=${selectedGroup.categoryObjectId()})}">
                <span class="resource-plus-drop">
                  <span class="group-toggle resource-plus-mark" aria-hidden="true"></span>
                  <span class="visually-hidden">New page</span>
                </span>
              </a>
            </li>
            <th:block th:each="item : ${panePages}">
              <li th:replace="~{fragments/shared :: page-row(item=${item}, returnGroup=${selectedGroup.id})}"></li>
            </th:block>
          </ul>
        </div>

        <ul class="item-list" th:if="${paneApps == null and paneThemes == null and panePlaylists == null and paneUrlTemplates == null and paneCategories == null and panePages == null}">
          <li class="resource-plus-tile" th:if="${selectedGroup.canAcceptFiles()}">
            <form th:action="@{/editor/resources/upload}" method="post" enctype="multipart/form-data"
                  class="resource-plus-form" id="resourceUploadForm">
              <th:block th:replace="~{fragments/csrf :: field}"></th:block>
              <input type="hidden" id="resourceId" name="resourceId"/>
              <input type="hidden" id="metadata" name="metadata"/>
              <input type="hidden" name="groupId"
                     th:value="${selectedGroup.id}"/>
              <input type="hidden" name="returnGroup" th:value="${selectedGroup.id}"/>
              <div class="resource-plus-drop" id="dropZone">
                <span class="group-toggle resource-plus-mark" aria-hidden="true"></span>
                <span class="visually-hidden">Upload resources</span>
                <input type="file" id="file" name="file"
                       accept=".jpg,.jpeg,.png,.heic,.heif,.mp3,.mp4,.mov,.m4v,.webm,.mkv,image/heic,image/heif,video/mp4,video/quicktime,video/webm"
                       multiple required/>
              </div>
              <div class="upload-progress" id="uploadProgress" hidden>
                <div class="upload-progress-fill" id="uploadProgressFill"></div>
                <div class="upload-progress-label" id="uploadProgressLabel">0%</div>
              </div>
            </form>
          </li>
          <li class="resource-folder-tile tile-row"
              th:each="child : ${selectedGroup.children}"
              th:classappend="${child.locked or child.guestDenied} ? 'is-locked'"
              th:attr="data-kind=${child.categoryNode ? 'category' : (child.virtual ? 'folder' : 'group')},
                       data-id=${child.categoryNode ? child.categoryObjectId() : child.id},
                       data-group-id=${child.id},
                       data-name=${child.humanReadableId},
                       data-parent-id=${selectedGroup.id},
                       data-can-create=${child.canCreateChild()},
                       data-can-rename=${child.canRename() or child.canEditCategory()},
                       data-can-delete=${child.canDelete() or child.canDeleteCategory()},
                       data-accept-files=${child.canAcceptFiles()},
                       data-can-drag=${child.canMove()},
                       draggable=${child.canMove()},
                       data-return-group=${selectedGroup.id},
                       data-create-href=${child.canCreateCategory() ? ((cseContextPath == '/' ? '' : (cseContextPath != null ? cseContextPath : '')) + '/editor/category/create') : ''},
                       data-create-page-href=${child.canCreatePage() ? ((cseContextPath == '/' ? '' : (cseContextPath != null ? cseContextPath : '')) + child.pageCreatePath()) : ''},
                       data-create-page-menu=${child.canCreatePageMenu()},
                       data-create-album-href=${child.canCreatePage() ? ((cseContextPath == '/' ? '' : (cseContextPath != null ? cseContextPath : '')) + child.albumCreatePath()) : ''},
                       data-create-album-menu=${child.canCreatePageMenu()},
                       data-edit-href=${child.canEditCategory() ? ((cseContextPath == '/' ? '' : (cseContextPath != null ? cseContextPath : '')) + child.categoryEditPath()) : ''}">
            <th:block th:replace="~{fragments/shared :: folder-access-lock(group=${child})}"></th:block>
            <div class="thumb-actions" th:if="${child.canDelete()}">
              <form th:action="@{/editor/resources/group/delete}" method="post" class="thumb-delete">
                <th:block th:replace="~{fragments/csrf :: field}"></th:block>
                <input type="hidden" name="groupId" th:value="${child.id}"/>
                <input type="hidden" name="returnGroup" th:value="${selectedGroup.id}"/>
                <button type="submit" class="thumb-action-btn thumb-delete-btn" title="Delete"
                        draggable="false"
                        onclick="return confirm('Delete this group and all its resources?')">×</button>
              </form>
            </div>
            <a class="resource-folder-link"
               th:if="${child.href != null}"
               th:attr="draggable=${child.canMove()} ? 'true' : 'false'"
               th:href="${(cseContextPath == '/' ? '' : (cseContextPath != null ? cseContextPath : '')) + child.href}">
              <span class="resource-folder-glyph" aria-hidden="true">
                <svg class="resource-folder-mark" viewBox="0 0 24 24" focusable="false">
                  <path d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.75a2.25 2.25 0 0 0-2.25-2.25H11.81a1.5 1.5 0 0 1-1.061-.44Z"/>
                </svg>
              </span>
              <span class="resource-folder-name" th:text="${child.humanReadableId}">Folder</span>
              <span class="group-summary" th:unless="${child.virtual or child.categoryNode}">
                <span th:text="${child.descendantFileCount}">0</span> files,
                <span th:text="${child.descendantTotalSizeLabel}">0 bytes</span>
              </span>
            </a>
            <a class="resource-folder-link"
               th:unless="${child.href != null}"
               th:attr="draggable=${child.canMove()} ? 'true' : 'false'"
               th:href="@{/editor/resources(group=${child.id})}">
              <span class="resource-folder-glyph" aria-hidden="true">
                <svg class="resource-folder-mark" viewBox="0 0 24 24" focusable="false">
                  <path d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.75a2.25 2.25 0 0 0-2.25-2.25H11.81a1.5 1.5 0 0 1-1.061-.44Z"/>
                </svg>
              </span>
              <span class="resource-folder-name" th:text="${child.humanReadableId}">Folder</span>
              <span class="group-summary">
                <span th:text="${child.descendantFileCount}">0</span> files,
                <span th:text="${child.descendantTotalSizeLabel}">0 bytes</span>
              </span>
            </a>
          </li>
          <li class="resource-folder-tile resource-page-tile tile-row"
              th:each="file : ${selectedGroup.treeFiles}"
              th:if="${file.page}"
              th:with="ctx=${cseContextPath == '/' ? '' : (cseContextPath != null ? cseContextPath : '')}"
              th:attr="data-kind=${file.kind()},
                       data-id=${file.key != null ? file.key : file.id},
                       data-key=${file.key},
                       data-name=${file.name},
                       data-can-rename=${file.canRename()},
                       data-can-delete=${file.canDelete()},
                       data-can-activate=${file.canActivate()},
                       data-return-group=${selectedGroup.id},
                       data-edit-href=${file.canEdit() ? ctx + file.href : ''},
                       data-open-href=${file.canOpen() ? ctx + file.href : ''}">
            <a class="resource-folder-link" draggable="false"
               th:href="${(cseContextPath == '/' ? '' : (cseContextPath != null ? cseContextPath : '')) + file.href}">
              <span class="resource-folder-glyph" aria-hidden="true">
                <svg class="resource-page-mark" viewBox="0 0 24 24" focusable="false">
                  <path d="M7 3.75h6.5L19.5 10v10.25H7z"/>
                  <path d="M13.5 3.75V10H19.5"/>
                </svg>
              </span>
              <span class="resource-folder-name" th:text="${file.name}">Page</span>
            </a>
          </li>
          <th:block th:each="resource : ${selectedGroup.resources}">
            <li th:replace="~{fragments/shared :: resource-row(resource=${resource}, returnGroup=${selectedGroup.id})}"></li>
          </th:block>
        </ul>
      </section>
    </div>
  </main>

  <script>
      (function () {
          var dropZone = document.getElementById('dropZone');
          var fileInput = document.getElementById('file');
          var form = document.getElementById('resourceUploadForm');
          var progress = document.getElementById('uploadProgress');
          var fill = document.getElementById('uploadProgressFill');
          var label = document.getElementById('uploadProgressLabel');
          if (!form || !dropZone || !fileInput || !progress || !fill || !label) {
              return;
          }
          var pane = form.closest('.resource-pane');
          var allowedExt = ['jpg', 'jpeg', 'png', 'heic', 'heif', 'mp3', 'mp4', 'mov', 'm4v', 'webm', 'mkv'];
          var queue = [];
          var usedIds = {};
          var total = 0;
          var completed = 0;
          var failed = [];
          var skipped = 0;
          var lastRedirect = null;
          var uploading = false;

          function fileExtension(name) {
              var lastDot = name.lastIndexOf('.');
              return lastDot >= 0 ? name.substring(lastDot + 1).toLowerCase() : '';
          }

          function isAllowed(file) {
              return file && file.name && allowedExt.indexOf(fileExtension(file.name)) !== -1;
          }

          function slugResourceId(fileName) {
              var lastDot = fileName.lastIndexOf('.');
              var baseName = lastDot > 0 ? fileName.substring(0, lastDot) : fileName;
              return baseName.toLowerCase().replace(/[^a-z0-9-]/g, '_');
          }

          function uniqueResourceId(fileName) {
              var base = slugResourceId(fileName);
              if (!base) {
                  base = 'resource';
              }
              var id = base;
              var n = 2;
              while (usedIds[id]) {
                  id = base + '_' + n;
                  n++;
              }
              usedIds[id] = true;
              return id;
          }

          function isInternalDrag() {
              return document.body.classList.contains('is-resource-drag')
                      || document.body.classList.contains('is-group-drag');
          }

          function isOsFileDrag(e) {
              if (isInternalDrag() || !e.dataTransfer || !e.dataTransfer.types) {
                  return false;
              }
              return Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') !== -1;
          }

          function setDropHighlight(on) {
              dropZone.classList.toggle('dragover', on);
              form.classList.toggle('is-dragover', on);
              if (pane) {
                  pane.classList.toggle('is-os-file-drag', on);
              }
          }

          function collectDroppedFiles(dataTransfer, callback) {
              var items = dataTransfer.items;
              if (!items || !items.length || typeof items[0].webkitGetAsEntry !== 'function') {
                  callback(Array.prototype.slice.call(dataTransfer.files || []));
                  return;
              }
              var files = [];
              var pending = 0;
              var sawEntry = false;

              function addPending() {
                  pending++;
              }

              function donePending() {
                  pending--;
                  if (pending === 0) {
                      callback(sawEntry ? files : Array.prototype.slice.call(dataTransfer.files || []));
                  }
              }

              function walk(entry) {
                  if (!entry) {
                      return;
                  }
                  if (entry.isFile) {
                      addPending();
                      entry.file(function (file) {
                          files.push(file);
                          donePending();
                      }, donePending);
                      return;
                  }
                  if (!entry.isDirectory) {
                      return;
                  }
                  var reader = entry.createReader();
                  addPending();
                  (function readBatch() {
                      reader.readEntries(function (batch) {
                          if (!batch.length) {
                              donePending();
                              return;
                          }
                          for (var i = 0; i < batch.length; i++) {
                              walk(batch[i]);
                          }
                          readBatch();
                      }, donePending);
                  })();
              }

              addPending();
              for (var i = 0; i < items.length; i++) {
                  var entry = items[i].webkitGetAsEntry();
                  if (entry) {
                      sawEntry = true;
                      walk(entry);
                  }
              }
              donePending();
          }

          function enqueueFiles(fileList) {
              var files = Array.prototype.slice.call(fileList || []);
              var accepted = [];
              var rejected = 0;
              for (var i = 0; i < files.length; i++) {
                  if (isAllowed(files[i])) {
                      accepted.push(files[i]);
                  } else {
                      rejected++;
                  }
              }
              if (!accepted.length) {
                  if (rejected && !uploading) {
                      showError('Invalid file type. Supported: jpg, png, heic, mp3, mp4, mov, webm, mkv');
                  }
                  return;
              }
              if (uploading) {
                  skipped += rejected;
              } else {
                  skipped = rejected;
              }
              queue = queue.concat(accepted);
              total += accepted.length;
              if (!uploading) {
                  startQueue();
              }
          }

          function startQueue() {
              uploading = true;
              setFormBusy(true);
              showProgress();
              uploadNext();
          }

          function uploadNext() {
              if (!queue.length) {
                  finishQueue();
                  return;
              }
              var file = queue.shift();
              var resourceId = uniqueResourceId(file.name);
              updateProgress(0, false);
              extractMetadata(file, function (metadata) {
                  sendFile(file, resourceId, metadata);
              });
          }

          function extractMetadata(file, callback) {
              var metadata = {};
              var ext = fileExtension(file.name);
              var fileUrl = URL.createObjectURL(file);
              var finished = false;

              function doneMeta() {
                  if (finished) {
                      return;
                  }
                  finished = true;
                  URL.revokeObjectURL(fileUrl);
                  callback(metadata);
              }

              if (['jpg', 'jpeg', 'png', 'heic', 'heif'].indexOf(ext) !== -1) {
                  var img = new Image();
                  img.onload = function () {
                      metadata.width = this.width;
                      metadata.height = this.height;
                      doneMeta();
                  };
                  img.onerror = doneMeta;
                  img.src = fileUrl;
                  return;
              }
              if (ext === 'mp3') {
                  var audio = new Audio();
                  audio.addEventListener('loadedmetadata', function () {
                      metadata.duration = Math.round(audio.duration);
                      doneMeta();
                  });
                  audio.addEventListener('error', doneMeta);
                  audio.src = fileUrl;
                  return;
              }
              if (['mp4', 'mov', 'm4v', 'webm', 'mkv'].indexOf(ext) !== -1) {
                  var video = document.createElement('video');
                  var timedOut = setTimeout(doneMeta, 3000);
                  video.addEventListener('loadedmetadata', function () {
                      clearTimeout(timedOut);
                      metadata.width = this.videoWidth;
                      metadata.height = this.videoHeight;
                      if (isFinite(this.duration)) {
                          metadata.duration = Math.round(this.duration);
                      }
                      doneMeta();
                  });
                  video.addEventListener('error', function () {
                      clearTimeout(timedOut);
                      doneMeta();
                  });
                  video.src = fileUrl;
                  return;
              }
              doneMeta();
          }

          function sendFile(file, resourceId, metadata) {
              var payload = new FormData(form);
              payload.delete('file');
              payload.set('file', file);
              payload.set('resourceId', resourceId);
              payload.set('metadata', JSON.stringify(metadata || {}));

              var xhr = new XMLHttpRequest();
              xhr.open(form.method || 'POST', form.action);
              var csrfToken = typeof window.csePrepareCsrf === 'function'
                      ? window.csePrepareCsrf(xhr, form) : '';
              if (csrfToken) {
                  payload.set('_csrf', csrfToken);
              }
              xhr.upload.addEventListener('progress', function (event) {
                  if (!event.lengthComputable) {
                      updateProgress(0, true);
                      return;
                  }
                  var percent = Math.round((event.loaded / event.total) * 100);
                  updateProgress(percent, percent >= 100);
              });
              xhr.upload.addEventListener('load', function () {
                  updateProgress(100, true);
              });
              xhr.addEventListener('load', function () {
                  if (xhr.status >= 200 && xhr.status < 300 && xhr.responseURL
                          && !samePath(xhr.responseURL, form.action)) {
                      lastRedirect = xhr.responseURL;
                      completed++;
                      uploadNext();
                      return;
                  }
                  var message = 'Upload failed';
                  try {
                      var doc = new DOMParser().parseFromString(xhr.responseText, 'text/html');
                      var serverError = doc.querySelector('.error-message');
                      if (serverError && serverError.textContent.trim()) {
                          message = serverError.textContent.trim();
                      }
                  } catch (err) {
                  }
                  failed.push(file.name + ': ' + message);
                  completed++;
                  uploadNext();
              });
              xhr.addEventListener('error', function () {
                  failed.push(file.name + ': Upload failed');
                  completed++;
                  uploadNext();
              });
              xhr.addEventListener('abort', function () {
                  failed.push(file.name + ': Upload cancelled');
                  completed++;
                  uploadNext();
              });
              xhr.send(payload);
          }

          function finishQueue() {
              uploading = false;
              fileInput.value = '';
              var notice = failed.slice(0, 8);
              if (failed.length > 8) {
                  notice.push('… and ' + (failed.length - 8) + ' more');
              }
              if (skipped > 0) {
                  notice.push('Skipped ' + skipped + ' unsupported file' + (skipped === 1 ? '' : 's'));
              }
              if (failed.length === 0 && skipped === 0 && lastRedirect) {
                  window.location.href = lastRedirect;
                  return;
              }
              if (failed.length === 0 && skipped === 0) {
                  window.location.reload();
                  return;
              }
              if (lastRedirect) {
                  try {
                      var url = new URL(lastRedirect, window.location.origin);
                      url.searchParams.set('notice', notice.join('\n'));
                      window.location.href = url.toString();
                      return;
                  } catch (e) {
                  }
              }
              showError(notice.join('\n'));
              hideProgress();
              resetQueue();
          }

          function resetQueue() {
              queue = [];
              usedIds = {};
              total = 0;
              completed = 0;
              failed = [];
              skipped = 0;
              lastRedirect = null;
          }

          function updateProgress(filePercent, processing) {
              var overall = total === 0 ? 0
                      : Math.round(((completed + Math.max(0, Math.min(100, filePercent)) / 100) / total) * 100);
              if (processing) {
                  progress.classList.add('is-processing');
                  fill.style.width = '';
              } else {
                  progress.classList.remove('is-processing');
                  fill.style.width = Math.max(0, Math.min(100, overall)) + '%';
              }
              if (total > 1) {
                  var current = Math.min(total, completed + 1);
                  label.textContent = current + ' / ' + total;
              } else if (processing || filePercent >= 100) {
                  label.textContent = 'Processing';
              } else {
                  label.textContent = filePercent + '%';
              }
          }

          function setFormBusy(busy) {
              form.classList.toggle('is-busy', busy);
              var controls = form.querySelectorAll('input, textarea, select, button');
              for (var i = 0; i < controls.length; i++) {
                  if (controls[i].type === 'hidden') {
                      continue;
                  }
                  controls[i].disabled = busy;
              }
          }

          function showProgress() {
              progress.hidden = false;
              updateProgress(0, false);
          }

          function hideProgress() {
              progress.hidden = true;
              progress.classList.remove('is-processing');
              fill.style.width = '';
              label.textContent = '';
              setFormBusy(false);
          }

          function samePath(left, right) {
              try {
                  return new URL(left, window.location.origin).pathname
                          === new URL(right, window.location.origin).pathname;
              } catch (e) {
                  return left === right;
              }
          }

          function onOsDragOver(e) {
              if (!isOsFileDrag(e)) {
                  return;
              }
              e.preventDefault();
              e.dataTransfer.dropEffect = 'copy';
              setDropHighlight(true);
          }

          function onOsDragLeave(e) {
              if (!isOsFileDrag(e)) {
                  return;
              }
              var next = e.relatedTarget;
              var host = pane || dropZone;
              if (next && host.contains(next)) {
                  return;
              }
              setDropHighlight(false);
          }

          function onOsDrop(e) {
              if (!isOsFileDrag(e)) {
                  return;
              }
              e.preventDefault();
              e.stopPropagation();
              setDropHighlight(false);
              collectDroppedFiles(e.dataTransfer, enqueueFiles);
          }

          dropZone.addEventListener('click', function () {
              if (form.classList.contains('is-busy')) {
                  return;
              }
              fileInput.click();
          });
          var dropHost = pane || dropZone;
          dropHost.addEventListener('dragover', onOsDragOver);
          dropHost.addEventListener('dragleave', onOsDragLeave);
          dropHost.addEventListener('drop', onOsDrop);
          fileInput.addEventListener('change', function () {
              if (this.files.length > 0) {
                  enqueueFiles(this.files);
                  this.value = '';
              }
          });
          form.addEventListener('submit', function (e) {
              e.preventDefault();
          });
          window.addEventListener('pageshow', function () {
              hideProgress();
              resetQueue();
          });
      })();

      (function () {
          var pane = document.querySelector('.resource-pane');
          var url = pane && pane.getAttribute('data-video-progress-url');
          if (!pane || !url) {
              return;
          }
          var timer = null;

          function processingRows() {
              return pane.querySelectorAll('.tile-row[data-video-status="processing"]');
          }

          function stop() {
              if (timer) {
                  clearTimeout(timer);
                  timer = null;
              }
          }

          function schedule(ms) {
              stop();
              timer = setTimeout(load, ms);
          }

          function setBar(row, percent, unknown) {
              var bar = row.querySelector('.thumb-progress');
              var fill = row.querySelector('.thumb-progress-fill');
              var label = row.querySelector('[data-video-percent]');
              if (label) {
                  label.textContent = unknown ? '…' : (percent + '%');
              }
              if (!bar || !fill) {
                  return;
              }
              if (unknown) {
                  bar.classList.add('is-unknown');
                  fill.style.width = '';
              } else {
                  bar.classList.remove('is-unknown');
                  fill.style.width = Math.max(0, Math.min(100, percent)) + '%';
              }
          }

          function setPoster(row, preview) {
              if (!preview) {
                  return;
              }
              var img = row.querySelector('.item-thumb-wrap > img.item-thumb');
              if (img) {
                  img.src = preview;
                  return;
              }
              var placeholder = row.querySelector('.item-thumb-audio');
              if (!placeholder) {
                  return;
              }
              var created = document.createElement('img');
              created.className = 'item-thumb';
              created.draggable = false;
              created.src = preview;
              placeholder.replaceWith(created);
          }

          function markFailed(row, video) {
              row.setAttribute('data-video-status', 'failed');
              var processing = row.querySelector('.thumb-tag-processing');
              if (processing) {
                  processing.remove();
              }
              var bar = row.querySelector('.thumb-progress');
              if (bar) {
                  bar.remove();
              }
              var tags = row.querySelector('.thumb-tags');
              if (tags && !row.querySelector('.thumb-tag-failed')) {
                  var tag = document.createElement('span');
                  tag.className = 'thumb-tag thumb-tag-failed';
                  tag.textContent = 'Failed';
                  var size = tags.querySelector('.thumb-tag-size');
                  if (size) {
                      tags.insertBefore(tag, size);
                  } else {
                      tags.appendChild(tag);
                  }
              }
              var transcode = row.querySelector('[data-video-transcode]');
              if (transcode) {
                  transcode.textContent = 'failed';
              }
              if (video && video.sizeLabel) {
                  var sizeTag = row.querySelector('.thumb-tag-size');
                  if (sizeTag) {
                      sizeTag.textContent = video.sizeLabel;
                  }
              }
          }

          function markReady(row, video) {
              row.setAttribute('data-video-status', 'ready');
              var processing = row.querySelector('.thumb-tag-processing');
              if (processing) {
                  processing.remove();
              }
              var bar = row.querySelector('.thumb-progress');
              if (bar) {
                  bar.remove();
              }
              setPoster(row, video.preview);
              if (video.sizeLabel) {
                  var sizeTag = row.querySelector('.thumb-tag-size');
                  if (sizeTag) {
                      sizeTag.textContent = video.sizeLabel;
                  }
              }
              var transcode = row.querySelector('[data-video-transcode]');
              if (transcode) {
                  transcode.textContent = 'ready';
              }
          }

          function applyVideo(video) {
              if (!video || !video.id) {
                  return;
              }
              var row = pane.querySelector('.tile-row[data-id="' + video.id + '"]');
              if (!row) {
                  return;
              }
              if (video.status === 'ready') {
                  markReady(row, video);
                  return;
              }
              if (video.status === 'failed') {
                  markFailed(row, video);
                  return;
              }
              var percent = typeof video.percent === 'number' ? video.percent : 0;
              setBar(row, percent, video.status === 'queued' && percent <= 0);
          }

          function load() {
              var rows = processingRows();
              if (!rows.length) {
                  stop();
                  return;
              }
              if (document.hidden) {
                  schedule(1500);
                  return;
              }
              var ids = [];
              for (var i = 0; i < rows.length; i++) {
                  ids.push(rows[i].getAttribute('data-id'));
              }
              fetch(url + (url.indexOf('?') === -1 ? '?' : '&') + 'ids=' + encodeURIComponent(ids.join(',')), {
                  credentials: 'same-origin',
                  headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }
              }).then(function (res) {
                  if (res.status === 401 || res.status === 403) {
                      stop();
                      return null;
                  }
                  if (!res.ok) {
                      throw new Error('progress');
                  }
                  return res.json();
              }).then(function (data) {
                  if (!data || !data.videos) {
                      return;
                  }
                  for (var i = 0; i < data.videos.length; i++) {
                      applyVideo(data.videos[i]);
                  }
              }).catch(function () {
              }).then(function () {
                  if (processingRows().length) {
                      schedule(1000);
                  } else {
                      stop();
                  }
              });
          }

          if (processingRows().length) {
              load();
          }
          document.addEventListener('visibilitychange', function () {
              if (!document.hidden && processingRows().length) {
                  load();
              }
          });
      })();

      (function () {
          var form = document.getElementById('packUploadForm');
          var dropZone = document.getElementById('packDropZone');
          var fileInput = document.getElementById('packFile');
          var slugInput = document.getElementById('packSlug');
          if (!form || !dropZone || !fileInput) {
              return;
          }
          var accept = (fileInput.getAttribute('accept') || '').toLowerCase();

          function allowed(name) {
              var lower = name.toLowerCase();
              if (accept.indexOf('.cseapp') !== -1) {
                  return lower.endsWith('.cseapp');
              }
              if (accept.indexOf('.csetheme') !== -1) {
                  return lower.endsWith('.csetheme');
              }
              return true;
          }

          function rejectMessage() {
              return accept.indexOf('.cseapp') !== -1
                      ? 'Only .cseapp files are accepted'
                      : 'Only .csetheme files are accepted';
          }

          function startPackUpload(file) {
              if (!allowed(file.name)) {
                  showError(rejectMessage());
                  fileInput.value = '';
                  return;
              }
              if (slugInput) {
                  slugInput.value = '';
              }
              form.requestSubmit();
          }

          dropZone.addEventListener('click', function () {
              fileInput.click();
          });
          dropZone.addEventListener('dragover', function (e) {
              if (document.body.classList.contains('is-resource-drag')
                      || document.body.classList.contains('is-group-drag')) {
                  return;
              }
              e.preventDefault();
              dropZone.classList.add('dragover');
              form.classList.add('is-dragover');
          });
          dropZone.addEventListener('dragleave', function () {
              dropZone.classList.remove('dragover');
              form.classList.remove('is-dragover');
          });
          dropZone.addEventListener('drop', function (e) {
              e.preventDefault();
              dropZone.classList.remove('dragover');
              form.classList.remove('is-dragover');
              if (document.body.classList.contains('is-resource-drag')
                      || document.body.classList.contains('is-group-drag')) {
                  return;
              }
              if (e.dataTransfer.files.length > 0) {
                  fileInput.files = e.dataTransfer.files;
                  startPackUpload(e.dataTransfer.files[0]);
              }
          });
          fileInput.addEventListener('change', function () {
              if (this.files.length > 0) {
                  startPackUpload(this.files[0]);
              }
          });
      })();

      function showError(message) {
          var existing = document.querySelector('.error-message');
          if (!existing) {
              existing = document.createElement('div');
              existing.className = 'error-message';
              var main = document.querySelector('.editor-main');
              if (main) {
                  main.insertBefore(existing, main.firstChild);
              }
          }
          existing.textContent = message;
          existing.hidden = false;
      }

      function resetResourceTip(row) {
          var tip = row.querySelector('.resource-tip');
          if (!tip) {
              return;
          }
          tip.style.position = '';
          tip.style.left = '';
          tip.style.right = '';
          tip.style.top = '';
          tip.style.bottom = '';
          tip.style.maxHeight = '';
          tip.style.maxWidth = '';
          tip.style.minWidth = '';
          tip.style.overflowY = '';
          tip.style.visibility = '';
      }

      function closeResourceTip(row) {
          row.classList.remove('tip-open');
          resetResourceTip(row);
      }

      function placeResourceTip(row) {
          var tip = row.querySelector('.resource-tip');
          if (!tip || !row.classList.contains('tip-open')) {
              return;
          }
          var tile = row.getBoundingClientRect();
          var pane = document.querySelector('.resource-pane') || document.querySelector('.editor-main');
          var pad = 8;
          var gap = 12;
          var area = pane ? pane.getBoundingClientRect() : { left: 0, right: window.innerWidth, top: 0, bottom: window.innerHeight };
          var leftBound = Math.max(pad, area.left + pad);
          var rightBound = Math.min(window.innerWidth - pad, area.right - pad);
          var topBound = Math.max(pad, area.top + pad);
          var bottomBound = Math.min(window.innerHeight - pad, area.bottom - pad);
          var avail = Math.max(160, rightBound - leftBound);
          tip.style.visibility = 'hidden';
          tip.style.position = 'fixed';
          tip.style.right = 'auto';
          tip.style.bottom = 'auto';
          tip.style.minWidth = '0';
          tip.style.maxWidth = Math.min(448, avail) + 'px';
          tip.style.maxHeight = '';
          tip.style.overflowY = '';
          tip.style.left = '0px';
          tip.style.top = '0px';
          var width = tip.offsetWidth;
          var height = tip.offsetHeight;
          var left = tile.right + gap;
          if (left + width > rightBound && tile.left - gap - width >= leftBound) {
              left = tile.left - gap - width;
          }
          if (left + width > rightBound) {
              left = rightBound - width;
          }
          if (left < leftBound) {
              left = leftBound;
          }
          var maxH = bottomBound - topBound;
          if (height > maxH) {
              tip.style.maxHeight = maxH + 'px';
              tip.style.overflowY = 'auto';
              height = maxH;
          }
          var top = tile.top;
          if (top + height > bottomBound) {
              top = bottomBound - height;
          }
          if (top < topBound) {
              top = topBound;
          }
          tip.style.left = Math.round(left) + 'px';
          tip.style.top = Math.round(top) + 'px';
          tip.style.visibility = '';
      }

      document.addEventListener('click', function (e) {
          var infoBtn = e.target.closest('.thumb-info-btn');
          var row = infoBtn ? infoBtn.closest('.tile-row') : null;
          var keepTip = e.target.closest('.resource-tip');
          document.querySelectorAll('.tile-row.tip-open').forEach(function (open) {
              if (open !== row && !(keepTip && open.contains(keepTip))) {
                  closeResourceTip(open);
              }
          });
          if (infoBtn && row) {
              e.preventDefault();
              if (row.classList.contains('tip-open')) {
                  closeResourceTip(row);
              } else {
                  row.classList.add('tip-open');
                  requestAnimationFrame(function () {
                      placeResourceTip(row);
                  });
              }
          }
      });
      window.addEventListener('resize', function () {
          document.querySelectorAll('.tile-row.tip-open').forEach(placeResourceTip);
      });
      document.addEventListener('scroll', function () {
          document.querySelectorAll('.tile-row.tip-open').forEach(placeResourceTip);
      }, true);

      (function () {
          var grid = document.getElementById('themeGrid');
          if (!grid) {
              return;
          }
          var dragged = null;
          grid.querySelectorAll('li[draggable="true"]').forEach(function (row) {
              row.addEventListener('dragstart', function (e) {
                  if (e.target.closest('.thumb-actions, .resource-tip')) {
                      e.preventDefault();
                      return;
                  }
                  dragged = row;
              });
              row.addEventListener('dragover', function (e) {
                  e.preventDefault();
              });
              row.addEventListener('drop', function (e) {
                  e.preventDefault();
                  if (!dragged || dragged === row || row.getAttribute('draggable') !== 'true') {
                      return;
                  }
                  row.parentNode.insertBefore(dragged, row);
                  var form = document.getElementById('reorderForm');
                  if (!form) {
                      return;
                  }
                  form.querySelectorAll('input[name="themeIds"]').forEach(function (n) { n.remove(); });
                  grid.querySelectorAll('li[draggable="true"]').forEach(function (ordered) {
                      var input = document.createElement('input');
                      input.type = 'hidden';
                      input.name = 'themeIds';
                      input.value = ordered.getAttribute('data-theme-id');
                      form.appendChild(input);
                  });
                  form.submit();
              });
          });
      })();
  </script>
  <script id="script-cse-waveform" type="text/javascript"
          th:src="@{/content-public/js/cse-waveform.js}"
          src="../../../static/content-public/js/cse-waveform.js"></script>
</div>
