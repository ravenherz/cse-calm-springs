import com.ravenherz.build.utils.DeploymentLayout
import com.ravenherz.build.utils.GitHelper
import com.ravenherz.build.utils.OptiDeployUploader
import groovy.json.JsonBuilder
import groovy.json.JsonSlurper
import org.springframework.boot.gradle.tasks.bundling.BootWar

plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}


group = 'com.ravenherz'
description = 'calm-springs-engine'

repositories {
    mavenCentral()
}

tasks.named("bootRun") { Task it ->
    optimizedLaunch = false
}

dependencies {

    implementation 'org.jetbrains:annotations:24.0.0'
    LinkedHashMap<String, String> versions = [
            'spring':'6.2.11',
            'thymeleaf':'3.1.5',
    ]

    implementation 'org.springframework.boot:spring-boot-starter-web'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //Thymeleaf
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf:${versions['thymeleaf']}"

    // HTMLHelper
    implementation 'com.j2html:j2html:1.5.0'
    implementation project(':cse-content')
    implementation project(':cse-themes')
    implementation project(':cse-apps')
    implementation project(':cse-transfer')
    implementation project(':cse-install')
    implementation project(':cse-core')
    implementation project(':cse-redirect')
    implementation project(':cse-scripting-js')
    implementation project(':cse-admin')
    implementation project(':cse-codec-pdf')
    implementation project(':cse-media')
    implementation project(':cse-codec-image')
    implementation project(':cse-codec-audio')
    // Mongo adapter. Feature documents live in the feature modules.
    implementation project(':cse-db-mongo')
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Apache
    implementation group: 'org.apache.commons', name: 'commons-collections4', version:'4.1'
    implementation group: 'commons-io', name: 'commons-io', version: '2.14.0'
    implementation group: 'commons-fileupload', name: 'commons-fileupload', version: '1.6.0'

    implementation project(':cse-codec-video')
    implementation project(':cse-security')

    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.19.2'
    //implementation group: 'org.apache.tomcat', name: 'tomcat-jsp-api', version:'10.1.43'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

// FFmpeg and JavaCPP jars come from :cse-codec-video. Boot still nests them in this WAR.
// Keep requiresUnpack while FfmpegBinaries reads classpath*:org/bytedeco/ffmpeg/.
// Do not drop it when cleaning dependencies.
tasks.withType(BootWar).configureEach {
    requiresUnpack '**/ffmpeg-*.jar'
    requiresUnpack '**/javacpp-*.jar'
}

def currentVersion = '0.8.0'

tasks.register('buildPreparations') {
    doFirst {
        String branch = GitHelper.getGitBranch()
        def json = new JsonSlurper()

        def pathToBuildInfo = project.file('./build-info/build-info.json').absolutePath
        def buildInfo = json.parseText(file(pathToBuildInfo).text)
        buildInfo.build.number++
        version = "$currentVersion.${buildInfo.build.number}.${branch.replace("/", "-")}"
        description = rootProject.name
        buildInfo.artifact.latest.name = "${project.name}-${version}.war"
        project.file(pathToBuildInfo).write(new JsonBuilder(buildInfo).toPrettyString())

        def pathToBuildInfoProjectFile = project.file('./src/main/resources/static/content-private/configuration/config-build-info.json').absolutePath
        def buildInfoProjectFile = json.parseText(file(pathToBuildInfoProjectFile).text)
        buildInfoProjectFile['version-product'] = description
        buildInfoProjectFile['version-version'] = "$currentVersion.${buildInfo.build.number}"
        buildInfoProjectFile['version-branch'] = branch == 'master' ? "" : "${branch.toLowerCase()}"
        project.file(pathToBuildInfoProjectFile).write(new JsonBuilder(buildInfoProjectFile).toPrettyString())
    }
}

compileJava.dependsOn(buildPreparations)

def frontendModules = rootProject.childProjects.keySet()
        .findAll { it.startsWith('app-') || it.startsWith('theme-') }
        .sort()
frontendModules.each { evaluationDependsOn(":$it") }

tasks.register('packFrontend') {
    group = 'distribution'
    description = 'Pack every app-* (.cseapp) and theme-thymeleaf-* / theme-js-* (.csetheme) module'
    dependsOn frontendModules.collect { ":${it}:packRelease" }
}

// Include selected packs in the WAR by hand. Packing is packFrontend — do not
// drive which modules get packed from this list. This include block will change.
tasks.named('processResources', Copy) {
    dependsOn tasks.named('packFrontend')
    doFirst {
        delete file("$buildDir/resources/main/install/themes")
    }
    from(project(':app-setup').tasks.named('packRelease')) {
        into 'install'
        rename { 'setup.cseapp' }
    }
    from(project(':app-admin').tasks.named('packRelease')) {
        into 'install'
        rename { 'admin.cseapp' }
    }
    from(project(':app-login').tasks.named('packRelease')) {
        into 'install'
        rename { 'login.cseapp' }
    }
    from(project(':theme-thymeleaf-modern').tasks.named('packRelease')) {
        into 'install/themes'
        rename { 'modern.csetheme' }
    }
}

tasks.register('optiDeploy') {
    group = 'distribution'
    description = 'Upload the built WAR in 8 parts through cse-optideployer and deploy it. Not part of build.'
    dependsOn tasks.named('bootWar')
    doLast {
        def instance = rootProject.cseInstance.toString()
        def layout = new DeploymentLayout(rootProject.file('.cse-deployment.json'))
        def cfg = layout.serverConfig(instance)
        def war = tasks.named('bootWar', BootWar).get().archiveFile.get().asFile
        OptiDeployUploader.upload(cfg.uploadUrl.toString(), cfg.secret.toString(), war)
    }
}

tasks.register('packBuiltinThemes') {
    group = 'distribution'
    description = 'Deprecated alias for packFrontend'
    dependsOn tasks.named('packFrontend')
}

ext.resolveValue = { path }
