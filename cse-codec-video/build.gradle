plugins {
    id 'java-library'
}

apply from: rootProject.file('gradle/cse-db.gradle')

description = 'Codec for FFmpeg probe and transcode. Owns the transcode document. Mongo and HTTP stay outside.'

dependencies {
    api project(':cse-dal-core')
    implementation project(':cse-media')
    implementation 'org.springframework.data:spring-data-mongodb'
    implementation 'org.slf4j:slf4j-api'
    implementation 'org.springframework:spring-core'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.bytedeco:javacpp:1.5.12'
    implementation 'org.bytedeco:javacpp:1.5.12:windows-x86_64'
    implementation 'org.bytedeco:javacpp:1.5.12:linux-x86_64'
    implementation 'org.bytedeco:ffmpeg:7.1.1-1.5.12'
    implementation 'org.bytedeco:ffmpeg:7.1.1-1.5.12:windows-x86_64'
    implementation 'org.bytedeco:ffmpeg:7.1.1-1.5.12:linux-x86_64'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
